  <text x="80" y="1550" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#1f2a24">Så testar du: tryck på ”Visa streckkoden för kameran” på startsidan</text>
  <text x="80" y="1590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#1f2a24">och håll koden 15–30 cm framför kameran. Visa den på en telefon</text>
  <text x="80" y="1630" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#1f2a24">med full ljusstyrka, eller skriv ut kortet.</text>
